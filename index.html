<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">📝 My To-Do List</h2>

    <!-- Input field and button -->
    <div class="input-group mb-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task" />
      <button class="btn btn-primary" id="addBtn">Add Task</button>
    </div>

    <!-- Task list -->
    <ul class="list-group" id="taskList"></ul>
  </div>

  <!-- Script Section -->
  <script>
    // Grab elements
    const addBtn = document.getElementById("addBtn");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    // Add task on button click
    addBtn.addEventListener("click", function () {
      const taskText = taskInput.value.trim();

      if (taskText === "") {
        alert("Please enter a task!");
        return;
      }

      // Create new task item
      const li = document.createElement("li");
      li.className = "list-group-item d-flex justify-content-between align-items-center";

      li.innerHTML = `
        <span class="task-text">${taskText}</span>
        <div>
          <button class="btn btn-success btn-sm me-2 completeBtn">DONE</button>
          <button class="btn btn-danger btn-sm deleteBtn">REM</button>
        </div>
      `;

      // Append to list
      taskList.appendChild(li);

      // Clear input
      taskInput.value = "";
    });

    // Event delegation for dynamic tasks
    taskList.addEventListener("click", function (e) {
      if (e.target.classList.contains("deleteBtn")) {
        e.target.closest("li").remove();
      }

      if (e.target.classList.contains("completeBtn")) {
        const taskText = e.target.closest("li").querySelector(".task-text");
        taskText.classList.toggle("completed");
      }
    });
  </script>
</body>
</html>
